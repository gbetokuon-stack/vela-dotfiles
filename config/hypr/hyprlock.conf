# =============================================================================
#  VELA "NOCTURNE PRISM" — 144Hz Cyber-Glass Multi-Widget HUD Lock & Login Screen
#  Dynamically colored by Matugen v4 (~/.config/hypr/hyprlock-colors.conf)
# =============================================================================
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    grace = 0
}

# 144Hz Silky Expressive Animations (fadeIn, fadeOut, dot pop-in, dynamic pill width)
animations {
    enabled = true
    bezier = velaOut, 0.16, 1.0, 0.30, 1.0
    bezier = velaSnappy, 0.05, 0.9, 0.10, 1.05
    bezier = linear, 1.0, 1.0, 0.0, 0.0

    animation = fadeIn, 1, 4.2, velaOut
    animation = fadeOut, 1, 3.2, velaOut
    animation = inputFieldColors, 1, 2.8, linear
    animation = inputFieldFade, 1, 2.5, velaOut
    animation = inputFieldWidth, 1, 3.8, velaSnappy
    animation = inputFieldDots, 1, 3.0, velaSnappy
}

# Deep 4-Pass Blurred Wallpaper Backdrop
background {
    monitor =
    path = ~/.cache/vela/current_wallpaper.img
    color = $bg
    blur_passes = 4
    blur_size = 10
    noise = 0.018
    contrast = 1.08
    brightness = 0.54
    vibrancy = 0.28
    vibrancy_darkness = 0.12
}

# =============================================================================
# 1. TOP HUD STATUS CAPSULE
# =============================================================================
shape {
    monitor =
    size = 560, 44
    color = $bg
    rounding = 22
    border_size = 1
    border_color = $outline
    position = 0, -32
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(00000088)
}

label {
    monitor =
    text = cmd[update:15000] echo "󰣇  VICTUS ARCH   ·   󰖲  HYPRLAND 0.57.2   ·   󰅐  UP $(uptime -p | sed 's/up //')"
    color = $fg_muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -46
    halign = center
    valign = top
}

# =============================================================================
# 2. SCULPTURAL DUAL-TONE EDITORIAL CLOCK & DATE HUD
# =============================================================================
# Giant Hours (Primary Accent)
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $primary
    font_size = 122
    font_family = Inter Black
    position = -108, 215
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000099)
}

# Glowing Colon Divider
label {
    monitor =
    text = :
    color = $tertiary
    font_size = 98
    font_family = Inter Light
    position = 0, 223
    halign = center
    valign = center
}

# Giant Minutes (Crisp Light)
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $fg
    font_size = 122
    font_family = Inter Light
    position = 108, 215
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000099)
}

# Date & Day Pill
shape {
    monitor =
    size = 360, 38
    color = $surface
    rounding = 19
    border_size = 1
    border_color = $outline
    position = 0, 94
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] date +"◆   %A  ·  %d %B %Y   ◆"
    color = $primary
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 94
    halign = center
    valign = center
}

# =============================================================================
# 3. CENTER FROSTED OBSIDIAN-GLASS AUTHENTICATION DECK
# =============================================================================
shape {
    monitor =
    size = 450, 228
    color = $bg
    rounding = 30
    border_size = 1
    border_color = $outline
    position = 0, -68
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 16
    shadow_color = rgba(000000aa)
}

# Outer Halo Ring
shape {
    monitor =
    size = 70, 70
    color = rgba(00000000)
    rounding = 35
    border_size = 1
    border_color = $outline
    position = 0, -6
    halign = center
    valign = center
}

# Inner Avatar Ring & Geometric Prism Emblem
shape {
    monitor =
    size = 58, 58
    color = $surface
    rounding = 29
    border_size = 2
    border_color = $primary
    position = 0, -6
    halign = center
    valign = center
}

label {
    monitor =
    text = ◆
    color = $primary
    font_size = 24
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -6
    halign = center
    valign = center
}

# User Title & Workstation Tag
label {
    monitor =
    text = $USER  ·  NOCTURNE PRISM STUDIO
    color = $fg
    font_size = 13
    font_family = Inter Bold
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾   Authenticate to unlock 144Hz Wayland Session
    color = $fg_muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -83
    halign = center
    valign = center
}

# Interactive Dual-Gradient Frosted Pill Password Input
input-field {
    monitor =
    size = 350, 50
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.36
    dots_center = true
    dots_rounding = -1
    outer_color = $primary $tertiary 35deg
    inner_color = $surface
    font_color = $fg
    font_family = JetBrainsMono Nerd Font Bold
    fade_on_empty = false
    placeholder_text = <span foreground="##9ca7ba">󰌆   Enter passphrase...</span>
    hide_input = false
    rounding = 25
    check_color = $tertiary $primary 35deg
    fail_color = $error
    fail_text = <i>󰀨  $FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    position = 0, -134
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000077)
}

# =============================================================================
# 4. BOTTOM 3-CARD BENTO TELEMETRY DOCK
# =============================================================================
# Left Card: CPU & Hybrid GPU Status
shape {
    monitor =
    size = 280, 76
    color = $bg
    rounding = 22
    border_size = 1
    border_color = $outline
    position = -302, 34
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰻠  SILICON TELEMETRY
    color = $primary
    font_size = 9
    font_family = JetBrainsMono Nerd Font Bold
    position = -302, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] echo "Ryzen 7 7445HS · RTX 4050 ($(cat /sys/bus/pci/devices/0000:01:00.0/power/runtime_status 2>/dev/null || echo active))"
    color = $fg
    font_size = 11
    font_family = Inter SemiBold
    position = -302, 57
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] echo "RAM $(free -h | awk '/Mem:/ {print $3\" / \"$2}')   ·   144Hz VRR"
    color = $fg_muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -302, 40
    halign = center
    valign = bottom
}

# Center Card: Now Playing / Acoustic Audio Engine
shape {
    monitor =
    size = 300, 76
    color = $bg
    rounding = 22
    border_size = 1
    border_color = $outline
    position = 0, 34
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰎈  ACOUSTIC AUDIO STREAM
    color = $tertiary
    font_size = 9
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] playerctl metadata --format '{{title}}' 2>/dev/null | cut -c1-30 || echo "PipeWire Studio Ready"
    color = $fg
    font_size = 11
    font_family = Inter SemiBold
    position = 0, 57
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] playerctl metadata --format '{{artist}}' 2>/dev/null | cut -c1-30 || echo "Vol $(wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | awk '{printf \"%d%%\", $2*100}')"
    color = $fg_muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

# Right Card: Battery & Power Profile
shape {
    monitor =
    size = 280, 76
    color = $bg
    rounding = 22
    border_size = 1
    border_color = $outline
    position = 302, 34
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰁹  POWER & BATTERY
    color = $primary
    font_size = 9
    font_family = JetBrainsMono Nerd Font Bold
    position = 302, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo 100)%  ·  $(cat /sys/class/power_supply/BAT0/status 2>/dev/null || echo Full)"
    color = $fg
    font_size = 11
    font_family = Inter SemiBold
    position = 302, 57
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] echo "Profile: $(powerprofilesctl get 2>/dev/null || echo balanced)"
    color = $fg_muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 302, 40
    halign = center
    valign = bottom
}
