# Vela "Nocturne Prism" Kitty Configuration (Frosted Glass Blur + 3D Acoustic Header)
include colors.conf

font_family                JetBrainsMono Nerd Font
bold_font                  auto
italic_font                auto
bold_italic_font           auto
font_size                  11.0

# Lush Frosted Glass Blur (transparent background so Hyprland 4-pass blur shines through)
background_opacity         0.68
dynamic_background_opacity yes
background_blur            1
window_padding_width       12 18
confirm_os_window_close    0

# Expressive smooth cursor trail
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_trail               3
cursor_trail_decay         0.1 0.35
cursor_trail_start_threshold 2

# Crisp modern tab bar
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        round
tab_title_template         " {index}: {title} "

# Shell & usability (auto-uses fish from ~/.local/bin or /usr/bin, fallback to bash)
shell                      bash -lc 'export PATH="$HOME/.local/bin:$PATH"; command -v fish >/dev/null 2>&1 && exec fish || exec bash'
enable_audio_bell          no
scrollback_lines           10000
url_style                  curly
allow_remote_control       yes
listen_on                  unix:/tmp/vela-kitty
