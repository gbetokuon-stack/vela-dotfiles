# Vela Minimalist Starship Prompt (Matugen v4 Dynamic)
add_newline = false
format = """
[◆](bold #ffffff) $directory$git_branch$git_status$python$nodejs$rust$cmd_duration
[❯](bold #e2e2e2) """

[directory]
style = "bold #ffffff"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold #e2e2e2"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #c6c6c6"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 1500
style = "#c6c6c6"
format = "[󰔟 $duration]($style)"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "#c6c6c6"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "#e2e2e2"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "#ffb4ab"
